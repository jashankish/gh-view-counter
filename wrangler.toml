name = "gh-view-counter"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# The two values marked "your value" below are specific to each deployment.
# Either edit them here before deploying, or leave them as they are and let the
# GitHub Actions workflow fill them in from repository settings at deploy time
# (D1_DATABASE_ID secret, ALLOWED_USERS variable), so they never appear in the repo.

[vars]
# Your value: comma-separated GitHub usernames allowed to have counters, e.g.
# "octocat". Keeps strangers from using up your free-tier quota.
# Empty means anyone can use your deployment.
ALLOWED_USERS = ""
# "true" = only requests from GitHub's camo proxy increment the count;
# opening the badge URL directly in a browser just shows the current value.
COUNT_ONLY_CAMO = "false"

[[d1_databases]]
binding = "DB"
database_name = "gh-view-counter"
# Your value: the id printed by `npm run db:create`. The all-zero placeholder
# works for local development (`npm run dev`) but not for deploying.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
