name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Deploys to the Cloudflare account configured in this repository's settings:
  #   secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID
  #   variables: ALLOWED_USERS (optional)
  # Without CLOUDFLARE_API_TOKEN the deploy is skipped, so forks pass CI as-is.
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      ALLOWED_USERS: ${{ vars.ALLOWED_USERS }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.config.outputs.ready == 'true'
      # Fill in this deployment's values without committing them.
      - name: Apply deployment settings
        if: steps.config.outputs.ready == 'true'
        run: |
          if [ -n "$D1_DATABASE_ID" ]; then
            sed -i "s/^database_id = .*/database_id = \"$D1_DATABASE_ID\"/" wrangler.toml
          fi
          if [ -n "$ALLOWED_USERS" ]; then
            sed -i "s/^ALLOWED_USERS = .*/ALLOWED_USERS = \"$ALLOWED_USERS\"/" wrangler.toml
          fi
          if grep -q '^database_id = "00000000-0000-0000-0000-000000000000"' wrangler.toml; then
            echo "::error::Set the D1_DATABASE_ID secret, or put your database id in wrangler.toml."
            exit 1
          fi
      - run: npx wrangler d1 migrations apply gh-view-counter --remote
        if: steps.config.outputs.ready == 'true'
      - run: npx wrangler deploy
        if: steps.config.outputs.ready == 'true'
